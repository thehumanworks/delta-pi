name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so a new pi release that breaks the extension is noticed before someone installs it.
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }}, pinned pi)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The oldest Node package.json supports, and the current LTS.
        node: ['22.19.0', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Configure Git for the tests' throwaway checkouts
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
      - run: npm run verify
      - name: Install the packed release into pi and load it
        run: npm run test:package

  latest-pi:
    # Advisory: the release gate is the pinned pi above. This job shows whether the newest pi still works.
    name: Tests against the latest pi (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save @earendil-works/pi-coding-agent@latest @earendil-works/pi-agent-core@latest @earendil-works/pi-ai@latest @earendil-works/pi-tui@latest
      - name: Configure Git for the tests' throwaway checkouts
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
      - run: npx pi --version
      - run: npm run check
      - run: npm test

  macos:
    # Advisory: most of the people working on Delta develop on macOS, so the checks should run there too.
    name: Verify on macOS (advisory)
    runs-on: macos-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Configure Git for the tests' throwaway checkouts
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
      - run: npm run verify
